media:
  input: assets/img/posts
  output: /assets/img/posts

content:
  - name: posts
    label: Blog Posts
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{primary}.md"
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Short Summary (SEO)
        type: string
      - name: date
        label: Publish Date
        type: datetime
        required: true
      - name: categories
        label: Categories (Max 2, e.g., Chromebooks, Reviews)
        type: string
        list: true
      - name: tags
        label: Tags (lowercase)
        type: string
        list: true
      - name: image
        label: Cover Image (1200x630)
        type: image
      - name: illustration
        label: Illustration / Photo Credit
        type: string
        hint: "Optional photo caption or credit"
      - name: pin
        label: Pin this post to top?
        type: boolean
        default: false
      - name: featured
        label: Feature on the homepage?
        type: boolean
        default: false
      - name: tldr
        label: TL;DR bullets (optional)
        type: string
        list: true
      - name: verdict
        label: Quick take box (optional)
        type: object
        fields:
          - name: title
            label: Heading
            type: string
          - name: score
            label: Score out of 10
            type: number
          - name: caption
            label: Score caption
            type: string
          - name: read_if
            label: Read this if
            type: string
            list: true
          - name: skip_if
            label: Skip it if
            type: string
            list: true
      - name: body
        label: Content
        type: rich-text
