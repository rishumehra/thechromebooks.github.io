media:
  input: assets/img/posts
  output: /assets/img/posts

content:
  - name: posts
    label: Blog Posts
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{primary}.md"
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Short Summary (SEO)
        type: string
      - name: date
        label: Publish Date
        type: datetime
        required: true
      - name: categories
        label: Categories (Max 2, e.g., Chromebooks, Reviews)
        type: string
        list: true
      - name: tags
        label: Tags (lowercase)
        type: string
        list: true
      - name: image
        label: Cover Image (1200x630)
        type: image
      - name: pin
        label: Pin this post to top?
        type: boolean
        default: false
      - name: body
        label: Content
        type: rich-text
