<div
  class="search-overlay"
  role="dialog"
  aria-modal="true"
  aria-label="Search posts"
  data-search-index="{{ '/assets/js/data/search.json' | relative_url }}"
>
  <div class="search-box">
    <div class="search-input-wrap">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.4" y2="16.4"></line></svg>
      <input type="search" placeholder="Search posts, guides, reviews&hellip;" aria-label="Search posts" autocomplete="off">
      <kbd>Esc</kbd>
      <button class="icon-btn search-close" type="button" data-search-close aria-label="Close search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
    <div class="search-results" aria-live="polite"></div>
    <p class="search-status sr-only" role="status"></p>
  </div>
</div>
